notes: |
  Px437 IBM VGA 8×16 is VileR's reconstruction of the native IBM VGA
  text-mode typeface (CP437 codepage coverage), mirrored as two artifacts:

    - Px437_IBM_VGA_8x16.ttf — TrueType font file
    - Px437_IBM_VGA_8x16.woff2 — WOFF2 lossless web compression generated
      via `fonttools ttLib.woff2 compress` from the unmodified TrueType file

  Both artifacts retain VileR's upstream CC-BY-SA-4.0 license
  (`fonts/LICENSE.CC-BY-SA-4.0`). The TrueType glyph outlines, metrics, and
  OS/2 tables are unmodified.
