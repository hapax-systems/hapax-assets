notes: |
  Clean-room approximation of Enlightenment/Moksha default theme color classes,
  dedicated to the public domain under CC0-1.0 with no human copyright claim.

  If an upstream Moksha .edc file is mirrored later:
    1. Replace the RGB values in enlightenment/themes/moksha.edc.
    2. Update the sha256 digest in _manifest.yaml.
    3. Update this provenance.yaml with the upstream commit, author, and license.

  Color classes approximated:
    bg_color      — dark grey panel background  (#252525)
    fg_color      — soft light foreground       (#cccccc)
    text_color    — primary text                (#e0e0e0)
    fg_selected   — selection highlight (white) (#ffffff)
    focus_color   — cornflower blue accent      (#6495ed)
    success_color — dim green                   (#60b860)
    alert_color   — dim red                     (#cc6060)
