<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" data-derivation="https://hapaxresearch.com/about/#emblem-derivation">
  <title>The mark is one glyph under two descriptions, each necessary, sharing one field.</title>
